name: Daily AI Radar Fetch

on:
  schedule:
    # 每天 UTC 0:00 运行 (北京时间早上 8:00)
    - cron: "0 0 * * *"
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add data.json archive/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📡 Daily fetch: $(date +%Y-%m-%d)"
            git push
          fi
