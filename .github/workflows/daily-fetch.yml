name: Daily AI Radar Fetch + Deploy

on:
  schedule:
    - cron: "0 0 * * *"          # 每天 UTC 0:00 (北京时间 8:00)
  workflow_dispatch:              # 允许手动触发
  push:
    branches:
      - main
    paths:
      - "ai-radar/**"

# 确保两个 job 串行，且都有 Pages 权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ai-radar/requirements.txt

      - name: Run fetch script
        run: cd ai-radar && python fetch.py

      - name: Commit and push data.json
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add ai-radar/data.json ai-radar/archive/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📡 Daily fetch: $(date +%Y-%m-%d)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-radar

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
